[project]
name = "safe-folder-copy"
version = "1.0.1"
description = "Copy a folder to another drive without stopping on damaged files, verifying every file and never touching the original."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KelvianLab" }]
dependencies = []

[project.scripts]
safe-folder-copy = "safe_folder_copy.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
